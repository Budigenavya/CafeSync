<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#18372d">
  <title>CafeSync · Connection Required</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f5f8f5;color:#293b30;font:16px system-ui,sans-serif}
    main{width:min(440px,100%);padding:32px;border:1px solid #e2e9e3;border-radius:18px;background:#fff;text-align:center;box-shadow:0 14px 40px #18372d12}
    .icon{width:58px;height:58px;margin:auto;display:grid;place-items:center;border-radius:17px;background:#eaf5ef;color:#167b5c;font-size:28px}
    h1{margin:18px 0 8px;font-size:22px}p{color:#748178;line-height:1.6}button{margin-top:10px;padding:11px 18px;border:0;border-radius:8px;background:#167b5c;color:#fff;font-weight:700;cursor:pointer}
  </style>
</head>
<body><main><div class="icon">☕</div><h1>Connection required</h1><p>CafeSync needs an active connection to your POS server to load bills, orders, and live cafe data.</p><button onclick="location.reload()">Try again</button></main></body>
</html>
